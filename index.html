function mulberry32(seed) {
  return function () {
    let t = (seed += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  const rand = mulberry32(20260907);
  for (let i = list.length - 1; i > 0; i--) {

  const dpr = Math.min(2, window.devicePixelRatio || 1);
  function resize() {

    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = `${w}px`; canvas.style.height = `${h}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    stars = Array.from({ length: count }, () => ({

      base: Math.random() * 0.55 + 0.25, speed: Math.random() * 0.9 + 0.25,

    for (const s of stars) {

      }
    }
    if (Math.random() < dt * 0.25 && meteors.length < 2) {
      meteors.push({ x: Math.random() * w * 0.8 + w * 0.1, y: -20, vx: -(w / (1400 + Math.random() * 800)), vy: h / (1200 + Math.random() * 900) + 0.2, life: 1 });

      const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 90, m.y - m.vy * 360);

  }

        <div class="pointer-events-none absolute inset-x-0 bottom-0 z-20 h-28 bg-gradient-to-t from-[#0a0618] via-[#0a0618]/80 to-transparent"></div>
        <div class="pointer-events-none absolute inset-x-3 z-20 rounded-2xl border-2 border-fuchsia-400/60" style="top:${BOX_H / 2 - ROW_H / 2 + 6}px;height:${ROW_H - 12}px;box-shadow: 0 0 30px -4px rgba(217,70,239,0.55), inset 0 0 24px -12px rgba(217,70,239,0.4);"></div>
        <div class="pointer-events-none absolute right-0 top-1/2 z-20 -translate-y-1/2 text-fuchsia-300" style="filter: drop-shadow(0 0 8px rgba(240,171,252,0.9));"><i data-lucide="chevron-left" style="width:30px;height:30px;"></i></div>
        <div class="pointer-events-none absolute left-0 top-1/2 z-20 -translate-y-1/2 text-fuchsia-300" style="filter: drop-shadow(0 0 8px rgba(240,171,252,0.9));"><i data-lucide="chevron-right" style="width:30px;height:30px;"></i></div>
        <div class="reel-strip absolute inset-x-0 top-0 will-change-transform"></div>
      </div>
      <div class="mt-4 flex items-center justify-center gap-2 text-sm text-violet-300/70">
        <i data-lucide="package" style="width:16px;height:16px;"></i>
        <span>مستودع منتجات الليلة: ${toArabicDigits(500)} منتجاً عشوائياً</span>
      </div>
    </div>`;
  if (window.lucide) lucide.createIcons();

  const box = container.querySelector(".reel-box");
  const stripEl = container.querySelector(".reel-strip");
  let strip = PRODUCTS.slice(40, 40 + STRIP_LEN);
  let y = BOX_H / 2 - ROW_H / 2;
  const startY = y;
  let raf = 0;
  let spinning = false;

  function renderStrip(lockedIdx) {
    stripEl.style.transform = `translateY(${y}px)`;
    stripEl.innerHTML = strip.map((p, i) => reelRowHtml(p, i, lockedIdx === i)).join("");
  }
  renderStrip(null);

  return {
    spinTo(product) {
      if (spinning) return;
      spinning = true;
      strip = buildStrip(product);
      y = startY;
      box.classList.remove("reel-blur");
      renderStrip(null);
      sound.whoosh();

      const y0 = startY, y1 = BOX_H / 2 - (WIN_AT * ROW_H + ROW_H / 2);
      const duration = 4600 + Math.random() * 700;
      const t0 = performance.now();
      let lastIdx = 0, lastY = y0, lastT = t0;

      function step(now) {
        const p = Math.min(1, (now - t0) / duration);
        y = y0 + (y1 - y0) * easeOutQuint(p);
        stripEl.style.transform = `translateY(${y}px)`;

        const vel = Math.abs(y - lastY) / Math.max(1, now - lastT);
        lastY = y; lastT = now;
        box.classList.toggle("reel-blur", vel > 0.35);

        const idx = Math.round((BOX_H / 2 - ROW_H / 2 - y) / ROW_H);
        if (idx !== lastIdx) { lastIdx = idx; if (p < 0.975) sound.tick(); }

        if (p < 1) {
          raf = requestAnimationFrame(step);
        } else {
          box.classList.remove("reel-blur");
          renderStrip(WIN_AT);
          sound.sparkle();
          setTimeout(() => { spinning = false; onDone(product); }, 850);
        }
      }
      raf = requestAnimationFrame(step);
    },
    destroy() { cancelAnimationFrame(raf); },
  };
}

/* ══════════════════════════════ عدّاد وقت العرض ══════════════════════════════ */
function mountPitchTimer(container, duration) {
  const R = 104, C = 2 * Math.PI * R;
  container.innerHTML = `
    <div class="flex flex-col items-center gap-5">
      <div class="relative" style="height:260px;width:260px;">
        <div class="timer-glow absolute inset-0 rounded-full transition-shadow duration-500" style="box-shadow:0 0 70px -8px rgba(168,85,247,0.55);"></div>
        <svg viewBox="0 0 240 240" class="h-full w-full" style="transform:rotate(-90deg);">
          <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop class="stop1" offset="0%" stop-color="#8b5cf6" /><stop class="stop2" offset="100%" stop-color="#e879f9" />
          </linearGradient></defs>
          <circle cx="120" cy="120" r="${R}" fill="none" stroke="rgba(124,58,237,0.18)" stroke-width="12" />
          <circle class="progress-ring" cx="120" cy="120" r="${R}" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0" style="transition: stroke-dashoffset 0.2s linear;" />
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <span class="timer-text font-display font-black tabular-nums tracking-tight text-white text-6xl"></span>
          <span class="timer-sub mt-1 text-sm text-violet-300/70"></span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button class="toggle-btn btn-neon flex h-12 items-center gap-2 rounded-2xl px-6 font-display font-bold text-white">
          <i data-lucide="play" style="width:18px;height:18px;"></i><span>ابدأ العد</span>
        </button>
        <button class="add-btn btn-ghost flex h-12 items-center gap-2 rounded-2xl px-5 font-bold text-violet-200">
          <i data-lucide="plus" style="width:18px;height:18px;"></i> ${formatSeconds(15)} ث
        </button>
      </div>
      <div class="hint-row flex items-center gap-1.5 text-xs text-violet-300/50">
        <i data-lucide="timer-reset" style="width:14px;height:14px;"></i> يمكنك الإيقاف متى ما انتهى المتسابق
      </div>
    </div>`;
  if (window.lucide) lucide.createIcons();

  let remaining = duration, running = false, done = false, endAt = null, raf = 0, lastWhole = duration;
  const textEl = container.querySelector(".timer-text");
  const subEl = container.querySelector(".timer-sub");
  const ringEl = container.querySelector(".progress-ring");
  const glowEl = container.querySelector(".timer-glow");
  const toggleBtn = container.querySelector(".toggle-btn");
  const hintRow = container.querySelector(".hint-row");
  const stop1 = container.querySelector(".stop1"), stop2 = container.querySelector(".stop2");

  function paint() {
    const danger = remaining <= 10;
    const progress = remaining / duration;
    textEl.textContent = done ? "انتهى" : formatSeconds(Math.max(0, remaining));
    textEl.className = `timer-text font-display font-black tabular-nums tracking-tight ${danger ? "text-rose-300" : "text-white"} ${done ? "text-5xl" : "text-6xl"}`;
    subEl.textContent = done ? "حان وقت التقييم" : running ? "المتسابق يسوّق الآن…" : "جاهز؟";
    ringEl.setAttribute("stroke-dashoffset", String(C * (1 - Math.max(0, progress))));
    glowEl.style.boxShadow = danger ? "0 0 70px -8px rgba(244,63,94,0.55)" : "0 0 70px -8px rgba(168,85,247,0.55)";
    stop1.setAttribute("stop-color", danger ? "#fb7185" : "#8b5cf6");
    stop2.setAttribute("stop-color", danger ? "#f43f5e" : "#e879f9");
    toggleBtn.innerHTML = running
      ? '<i data-lucide="pause" style="width:18px;height:18px;"></i><span>إيقاف مؤقت</span>'
      : done ? '<i data-lucide="play" style="width:18px;height:18px;"></i><span>إعادة الوقت</span>'
      : '<i data-lucide="play" style="width:18px;height:18px;"></i><span>ابدأ العد</span>';
    hintRow.style.display = done ? "none" : "flex";
    if (window.lucide) lucide.createIcons();
  }
  paint();

  function loop() {
    if (endAt == null) return;
    const left = Math.max(0, (endAt - performance.now()) / 1000);
    const rounded = Math.ceil(left - 1e-6);
    remaining = Math.ceil(left);
    if (rounded !== lastWhole) { lastWhole = rounded; if (rounded <= 5 && rounded > 0) sound.beep(); }
    if (left <= 0) { running = false; done = true; sound.alarm(); paint(); return; }
    paint();
    raf = requestAnimationFrame(loop);
  }

  toggleBtn.addEventListener("click", () => {
    sound.click();
    if (running) { running = false; cancelAnimationFrame(raf); paint(); return; }
    if (done) { remaining = duration; lastWhole = duration; done = false; endAt = performance.now() + duration * 1000; }
    else { endAt = performance.now() + remaining * 1000; }
    lastWhole = Math.ceil(remaining);
    running = true;
    raf = requestAnimationFrame(loop);
  });
  container.querySelector(".add-btn").addEventListener("click", () => {
    sound.click();
    if (running && endAt) endAt += 15000;
    remaining += 15;
    lastWhole = Math.ceil(remaining);
    done = false;
    paint();
  });

  return { destroy() { cancelAnimationFrame(raf); } };
}

            <div class="flex items-center gap-3">
              <span class="flex h-9 w-9 items-center justify-center rounded-full border border-dashed border-violet-300/30 text-violet-300/70"><i data-lucide="ghost" style="width:17px;height:17px;"></i></span>
              <div><div class="font-bold text-violet-100">تصويت سريع</div><div class="text-[11px] text-violet-300/60">للضيوف والمتفرجين — كل نقرة صوت مستقل</div></div>
            </div>
            <div class="voter-stars" data-voter="guest">${starsHtml(26, S.guestVote, false)}</div>
          </div>
        </div>
      </div>
      <button id="show-result-btn" class="btn-neon mt-8 flex items-center gap-3 rounded-2xl px-12 py-4 font-display text-lg font-black text-white" ${S.votes.votes === 0 ? "disabled" : ""}>
        <i data-lucide="trophy" style="width:20px;height:20px;"></i>${S.votes.votes === 0 ? "بانتظار أول صوت…" : "عرض النتيجة"}
      </button>
      <button id="skip-round-btn" class="mt-3 text-sm font-bold text-violet-300/60 hover:underline">تخطَّ بدون حفظ النتيجة</button>` + stageShellClose;
  }

  if (stage === "result" && S.currentPlayer) {
    const avg = S.votes.avg;
    const full = Math.round(avg || 0);
    let stars = "";
    for (let s = 1; s <= 5; s++) {
      stars += `<i data-lucide="star" style="width:34px;height:34px;" class="${s <= full ? "text-amber-200" : "text-violet-300/30"}" ${s <= full ? 'fill="#fcd34d"' : 'fill="none"'}></i>`;
    }
    return stageShellOpen("الحكم النهائي", "") +
      `<div class="glow-breathe glass-strong flex w-full max-w-md flex-col items-center rounded-[2rem] px-8 py-10">
        <div class="flex items-center gap-1.5">${stars}</div>
        <div class="mt-4 font-display text-6xl font-black text-white">${avg == null ? "—" : toArabicDigits(avg)}</div>
        <div class="mt-1 text-xs text-violet-300/60">متوسط ${toArabicDigits(S.votes.votes)} ${S.votes.votes === 1 ? "صوت" : "أصوات"}</div>
        <div class="mt-5 rounded-2xl bg-violet-500/10 px-5 py-3 font-display text-lg font-black text-fuchsia-200">${verdict(avg)}</div>
        <p class="mt-3 text-sm text-violet-200/70">${S.currentPlayer.name} × ${S.currentProduct ? S.currentProduct.name : ""}</p>
      </div>
      <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
        <button id="next-round-btn" class="btn-neon flex items-center gap-3 rounded-2xl px-10 py-4 font-display font-black text-white">
          <i data-lucide="arrow-left" style="width:19px;height:19px;"></i>${remainingPlayers().length > 0 ? "الجولة التالية" : "لوحة النتائج النهائية"}
        </button>
      </div>` + stageShellClose;
  }

  if (stage === "gameover") {
    const leaderboard = computeLeaderboard();
    let body;
    if (leaderboard.length === 0) {
      body = `<div class="glass max-w-md rounded-2xl px-8 py-10 text-violet-200/80"><i data-lucide="party-popper" style="width:30px;height:30px;" class="mx-auto mb-3 text-fuchsia-300"></i>لم تُقيَّم أي جولة بعد — العبوا جولة واحدة على الأقل لتتكوّن لوحة المتصدرين.</div>`;
    } else {
      body = `<div class="w-full max-w-md space-y-2.5">` + leaderboard.slice(0, 5).map((l, i) => `
        <div class="rise-in flex items-center justify-between gap-3 rounded-2xl border px-5 ${i === 0 ? "border-amber-300/50 bg-gradient-to-l from-amber-300/15 to-fuchsia-500/10 py-5" : "border-violet-300/15 bg-violet-950/40 py-3.5"}">
          <div class="flex items-center gap-3">
            ${i === 0 ? `<i data-lucide="crown" style="width:22px;height:22px;" class="text-amber-300"></i>` : `<span class="w-6 text-center font-display font-black text-violet-300/60">${toArabicDigits(i + 1)}</span>`}
            <span class="flex h-9 w-9 items-center justify-center rounded-full font-display text-sm font-black text-[#0d0722]" style="background:${l.color};">${l.name.slice(0, 1)}</span>
            <span class="font-bold text-white ${i === 0 ? "font-display text-lg font-black" : ""}">${l.name}</span>
          </div>
          <span class="flex items-center gap-1.5 rounded-xl bg-amber-300/10 px-3 py-1.5"><i data-lucide="star" style="width:14px;height:14px;" fill="#fcd34d" class="text-amber-300"></i><span class="font-display font-black text-amber-200">${l.avg == null ? "—" : toArabicDigits(l.avg)}</span></span>
        </div>`).join("") + `</div>`;
    }
    return stageShellOpen("انتهت الليلة", "عرش منتصف الليل") + body +
      `<button id="new-night-btn" class="btn-neon mt-8 flex items-center gap-3 rounded-2xl px-10 py-4 font-display font-black text-white"><i data-lucide="rotate-ccw" style="width:19px;height:19px;"></i> ليلة جديدة بنفس الأصدقاء</button>` + stageShellClose;
  }

  return "";
}

function sidePanelsHtml() {
  const leaderboard = computeLeaderboard();
  const history = computeHistory();
  const TABS = [
    { id: "players", label: "اللاعبون", icon: "users" },
    { id: "leaders", label: "المتصدرون", icon: "crown" },
    { id: "history", label: "السجل", icon: "history" },
  ];
  let tabContent = "";
  if (S.sideTab === "players") {
    tabContent = `<div class="flex gap-2">
      <input id="player-name-input" value="" placeholder="اسم اللاعب الجديد…" maxlength="24" class="input-night h-11 flex-1 rounded-xl px-4 text-sm text-violet-50 placeholder:text-violet-300/40" />
      <button id="add-player-btn" class="btn-neon flex h-11 items-center gap-1 rounded-xl px-4 text-sm font-bold text-white" ${S.busy ? "disabled" : ""}><i data-lucide="plus" style="width:16px;height:16px;"></i> أضف</button>
    </div>
    <p id="player-add-error" class="text-xs text-rose-300 mt-1"></p>` +
    (S.players.length === 0
      ? `<div class="flex flex-col items-center gap-3 rounded-2xl border border-dashed border-violet-300/20 py-10 text-center text-violet-300/60 mt-2.5"><i data-lucide="moon-star" style="width:28px;height:28px;"></i><p class="text-sm">لا لاعبين بعد — أضف أسماء أصدقائك<br />لتبدأ حفلة منتصف الليل</p></div>`
      : `<div class="space-y-2.5 mt-2.5">` + S.players.map((p, i) => `
        <div class="group flex items-center justify-between gap-3 rounded-2xl border border-violet-300/10 bg-violet-950/30 px-4 py-3">
          <div class="flex items-center gap-3 min-w-0">
            <span class="text-xs text-violet-300/40 font-display tabular-nums w-4">${toArabicDigits(i + 1)}</span>
            <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-white/15 font-display text-sm font-black text-[#0d0722]" style="background: radial-gradient(circle at 30% 30%, #fff8, transparent 40%), ${p.color}; box-shadow: 0 0 16px ${p.color}55;">${p.name.slice(0, 1)}</span>
            <span class="truncate font-bold text-violet-50">${p.name}</span>
          </div>
          <div class="flex items-center gap-2">
            ${p.participated ? `<span class="rounded-full bg-fuchsia-500/15 px-2.5 py-1 text-[11px] font-bold text-fuchsia-300">شارك ✓</span>` : `<span class="rounded-full bg-violet-500/15 px-2.5 py-1 text-[11px] text-violet-300/80">في الروليت</span>`}
            <button data-remove-player="${p.id}" class="remove-player-btn rounded-lg p-1.5 text-violet-300/40 opacity-0 transition-all hover:bg-rose-500/15 hover:text-rose-300 group-hover:opacity-100" aria-label="حذف ${p.name}"><i data-lucide="trash-2" style="width:15px;height:15px;"></i></button>
          </div>
        </div>`).join("") + `</div>`);
  } else if (S.sideTab === "leaders") {
    tabContent = leaderboard.length === 0
      ? `<div class="flex flex-col items-center gap-3 rounded-2xl border border-dashed border-violet-300/20 py-10 text-center text-violet-300/60"><i data-lucide="vote" style="width:28px;height:28px;"></i><p class="text-sm">لا تقييمات بعد — المتصدرون يظهرون<br />بعد أول جولة مقيّمة</p></div>`
      : `<div class="space-y-2.5">` + leaderboard.map((l, i) => {
          const ring = i === 0 ? "border-amber-300/60 bg-amber-300/10" : i === 1 ? "border-slate-300/40 bg-slate-300/10" : i === 2 ? "border-orange-300/40 bg-orange-300/10" : "border-violet-300/10 bg-violet-950/30";
          const icon = i === 0 ? "crown" : "medal";
          const iconCls = i === 0 ? "text-amber-300" : i === 1 ? "text-slate-200" : "text-orange-300";
          return `<div class="flex items-center justify-between gap-3 rounded-2xl border px-4 py-3 ${ring}">
            <div class="flex items-center gap-3 min-w-0">
              <span class="shrink-0 ${iconCls}"><i data-lucide="${icon}" style="width:18px;height:18px;"></i></span>
              <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full font-display text-xs font-black text-[#0d0722]" style="background:${l.color};">${l.name.slice(0, 1)}</span>
              <div class="min-w-0"><div class="truncate font-bold text-violet-50">${l.name}</div><div class="text-[11px] text-violet-300/60">${toArabicDigits(l.rounds)} جولة · ${toArabicDigits(l.votes)} صوت</div></div>
            </div>
            <div class="flex items-center gap-1.5 rounded-xl bg-amber-300/10 px-3 py-1.5"><i data-lucide="star" style="width:14px;height:14px;" fill="#fcd34d" class="text-amber-300"></i><span class="font-display font-black text-amber-200">${l.avg == null ? "—" : toArabicDigits(l.avg)}</span></div>
          </div>`;
        }).join("") + `</div>`;
  } else {
    tabContent = history.length === 0
      ? `<div class="flex flex-col items-center gap-3 rounded-2xl border border-dashed border-violet-300/20 py-10 text-center text-violet-300/60"><i data-lucide="history" style="width:28px;height:28px;"></i><p class="text-sm">الجولات السابقة تظهر هنا</p></div>`
      : `<div class="space-y-2.5">` + history.map((h) => `
        <div class="rounded-2xl border border-violet-300/10 bg-violet-950/30 px-4 py-3">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0">
              <span class="h-2.5 w-2.5 shrink-0 rounded-full" style="background:${h.playerColor || "#a78bfa"};"></span>
              <span class="truncate text-sm font-bold text-violet-50">${h.playerName}</span>
              <span class="text-violet-300/40">×</span>
              <span class="truncate text-sm text-violet-200/80">${h.product}</span>
            </div>
            <span class="flex shrink-0 items-center gap-1 text-xs text-amber-200/90"><i data-lucide="star" style="width:12px;height:12px;" fill="#fcd34d"></i>${h.avg == null ? "—" : toArabicDigits(h.avg)}</span>
          </div>
          <div class="mt-1 text-[11px] text-violet-300/40">منتج #${toArabicDigits(String(h.productIndex).padStart(3, "٠"))} · ${toArabicDigits(h.votes)} أصوات</div>
        </div>`).join("") + `</div>`;
  }

  return `<div class="glass flex h-full min-h-[420px] flex-col rounded-3xl p-5">
    <div class="mb-4 grid grid-cols-3 gap-2">
      ${TABS.map((t) => `<button data-tab="${t.id}" class="side-tab-btn flex items-center justify-center gap-1.5 rounded-xl px-2 py-2.5 text-sm font-bold transition-all ${S.sideTab === t.id ? "bg-gradient-to-l from-violet-600 to-fuchsia-600 text-white shadow-[0_6px_24px_-6px_rgba(168,85,247,0.6)]" : "text-violet-300/70 hover:bg-violet-500/10"}"><i data-lucide="${t.icon}" style="width:15px;height:15px;"></i>${t.label}</button>`).join("")}
    </div>
    <div class="relative flex-1 overflow-y-auto pl-1">${tabContent}</div>
  </div>`;
}

function render() {
  destroyMounts();
  app.innerHTML = `
    <canvas id="starfield" aria-hidden class="pointer-events-none fixed inset-0 z-0"></canvas>
    <div class="noise-overlay"></div>
    <header class="relative z-10 mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 pt-6 sm:px-6">
      <div class="flex items-center gap-3">
        <div class="pulse-ring flex h-12 w-12 items-center justify-center rounded-2xl bg-gradient-to-br from-violet-600 to-fuchsia-600" style="box-shadow: 0 0 30px -6px rgba(168,85,247,0.8);"><i data-lucide="moon-star" style="width:24px;height:24px;" class="text-white"></i></div>
        <div class="text-right">
          <div class="font-display text-lg font-black tracking-[0.18em] text-white" dir="ltr">MIDNIGHT <span class="text-glow">EVENTS</span></div>
          <div class="text-[11px] font-bold text-violet-300/70">روليت التسويق الليلي</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="mute-btn" class="btn-ghost flex h-10 w-10 items-center justify-center rounded-xl text-violet-200" aria-label="كتم الصوت"><i data-lucide="${S.muted ? "volume-x" : "volume-2"}" style="width:18px;height:18px;"></i></button>
        <button id="new-game-btn" class="btn-ghost flex h-10 items-center gap-2 rounded-xl px-3 text-sm font-bold text-violet-200" ${S.busy ? "disabled" : ""}><i data-lucide="rotate-ccw" style="width:16px;height:16px;"></i><span class="hidden sm:inline">لعبة جديدة</span></button>
        <button id="full-reset-btn" class="btn-ghost flex h-10 w-10 items-center justify-center rounded-xl text-violet-300/70 hover:text-rose-300" aria-label="مسح كل البيانات" ${S.busy ? "disabled" : ""}><i data-lucide="eraser" style="width:16px;height:16px;"></i></button>
      </div>
    </header>
    <main class="relative z-10 mx-auto grid max-w-7xl gap-6 px-4 pb-20 pt-8 sm:px-6 lg:grid-cols-[1fr_370px]">
      <section id="stage-section" class="glass min-h-[540px] rounded-[2rem] px-4 py-10 sm:px-10 flex flex-col items-center justify-center">${renderStage()}</section>
      <div id="side-panels">${sidePanelsHtml()}</div>
    </main>
    <footer class="relative z-10 pb-8 text-center text-xs text-violet-300/40">Midnight Events · صُنع لسهرات الأصدقاء · كل منتجٍ ينتظر مسوّقه</footer>`;

  if (window.lucide) lucide.createIcons();
  initStarfield();
  wireEvents();
  mountSubComponents();
}

/* ══════════════════════════════ ربط الأحداث ══════════════════════════════ */
function wireEvents() {
  const muteBtn = document.getElementById("mute-btn");
  if (muteBtn) muteBtn.addEventListener("click", () => {
    S.muted = !S.muted;
    sound.setMuted(S.muted);
    localStorage.setItem("me-muted", S.muted ? "1" : "0");
    sound.click();
    render();
  });

  const newGameBtn = document.getElementById("new-game-btn");
  if (newGameBtn) newGameBtn.addEventListener("click", () => doResetGame(false));

  const fullResetBtn = document.getElementById("full-reset-btn");
  if (fullResetBtn) fullResetBtn.addEventListener("click", () => doResetGame(true));

  // side panels
  document.querySelectorAll(".side-tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => { S.sideTab = btn.getAttribute("data-tab"); render(); });
  });
  const addPlayerBtn = document.getElementById("add-player-btn");
  const nameInput = document.getElementById("player-name-input");
  if (addPlayerBtn && nameInput) {
    const doAdd = () => {
      const n = nameInput.value.trim();
      const errEl = document.getElementById("player-add-error");
      if (n.length < 2) { errEl.textContent = "الاسم قصير جداً"; return; }
      const created = addPlayer(n);
      if (!created) { errEl.textContent = "تعذّرت الإضافة (مكرر أو ممتلئ)"; return; }
      S.players = db.players.slice();
      sound.sparkle();
      render();
    };
    addPlayerBtn.addEventListener("click", doAdd);
    nameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") doAdd(); });
  }
  document.querySelectorAll(".remove-player-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = Number(btn.getAttribute("data-remove-player"));
      const player = S.players.find((p) => p.id === id);
      if (player && window.confirm(`حذف «${player.name}» نهائياً؟`)) {
        removePlayer(id);
        S.players = db.players.slice();
        render();
      }
    });
  });

  // stage-specific
  const lobbyCta = document.getElementById("lobby-cta");
  if (lobbyCta) lobbyCta.addEventListener("click", () => {
    sound.click();
    if (isGameEnded()) { S.stage = "gameover"; render(); }
    else if (S.players.length >= 2) { S.stage = "name"; render(); }
  });

  const spinNameBtn = document.getElementById("spin-name-btn");
  if (spinNameBtn) spinNameBtn.addEventListener("click", () => {
    const rem = remainingPlayers();
    if (rem.length === 0 || S.spinningName) return;
    const idx = secureRandomIndex(rem.length);
    S.spinningName = true;
    render();
    const wheel = activeMounts.find((m) => m && m.spinTo);
    if (wheel) wheel.spinTo(idx);
  });

  const toProductBtn = document.getElementById("to-product-btn");
  if (toProductBtn) toProductBtn.addEventListener("click", () => { sound.click(); S.stage = "product"; render(); });

  const spinProductBtn = document.getElementById("spin-product-btn");
  if (spinProductBtn) spinProductBtn.addEventListener("click", () => {
    if (S.spinningProduct) return;
    const product = PRODUCTS[secureRandomIndex(PRODUCTS.length)];
    S.spinningProduct = true;
    S.currentProduct = product;
    render();
    const reel = activeMounts.find((m) => m && m.spinTo);
    if (reel) reel.spinTo(product);
  });

  const startPitchBtn = document.getElementById("start-pitch-btn");
  if (startPitchBtn) startPitchBtn.addEventListener("click", () => { sound.click(); S.stage = "pitch"; render(); });

  const retryProductBtn = document.getElementById("retry-product-btn");
  if (retryProductBtn) retryProductBtn.addEventListener("click", () => {
    if (S.productRetries <= 0) return;
    sound.click();
    S.productRetries -= 1;
    S.currentProduct = null;
    S.spinningProduct = false;
    S.stage = "product";
    render();
  });

  document.querySelectorAll(".dur-btn").forEach((btn) => {
    btn.addEventListener("click", () => { S.pitchDuration = Number(btn.getAttribute("data-dur")); render(); });
  });

  const toRateBtn = document.getElementById("to-rate-btn");
  if (toRateBtn) toRateBtn.addEventListener("click", () => {
    sound.click();
    if (S.roundId == null && S.currentPlayer && S.currentProduct) {
      S.roundId = ensureRound(S.currentPlayer, S.currentProduct);
    }
    S.myVotes = {};
    S.guestVote = 0;
    S.votes = { votes: 0, avg: null };
    S.stage = "rate";
    render();
  });

  document.querySelectorAll(".voter-stars .star-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const wrap = btn.closest(".voter-stars");
      const voterAttr = wrap.getAttribute("data-voter");
      const score = Number(btn.getAttribute("data-star"));
      sound.star(score);
      const voterId = voterAttr === "guest" ? null : Number(voterAttr);
      const result = submitRating(S.roundId, voterId, score);
      S.votes = result;
      if (voterId != null) S.myVotes[voterId] = score;
      else { S.guestVote = score; setTimeout(() => { S.guestVote = 0; render(); }, 500); }
      render();
    });
  });

  const showResultBtn = document.getElementById("show-result-btn");
  if (showResultBtn) showResultBtn.addEventListener("click", () => {
    S.stage = "result";
    sound.drumroll(1.1);
    if ((S.votes.avg || 0) >= 4) setTimeout(() => burst(2), 1200);
    render();
  });

  const skipRoundBtn = document.getElementById("skip-round-btn");
  if (skipRoundBtn) skipRoundBtn.addEventListener("click", () => { sound.click(); goNextRound(); });

  const nextRoundBtn = document.getElementById("next-round-btn");
  if (nextRoundBtn) nextRoundBtn.addEventListener("click", () => { sound.click(); goNextRound(); });

  const newNightBtn = document.getElementById("new-night-btn");
  if (newNightBtn) newNightBtn.addEventListener("click", () => doResetGame(false));
}

function goNextRound() {
  S.currentPlayer = null;
  S.currentProduct = null;
  S.roundId = null;
  S.votes = { votes: 0, avg: null };
  const left = remainingPlayers();
  S.stage = left.length > 0 ? "name" : "gameover";
  render();
}

function doResetGame(full) {
  const msg = full ? "مسح اللاعبين والنتائج والسجل بالكامل؟ لا رجعة!" : "بدء لعبة جديدة؟ سيعود الجميع إلى روليت الأسماء وتُمسح نتائج الجلسة.";
  if (!window.confirm(msg)) return;
  sound.click();
  resetGame(full);
  S.players = db.players.slice();
  S.currentPlayer = null;
  S.currentProduct = null;
  S.roundId = null;
  S.votes = { votes: 0, avg: null };
  S.stage = "lobby";
  render();
}

function mountSubComponents() {
  if (S.stage === "name") {
    const mount = document.getElementById("wheel-mount");
    if (mount) {
      const rem = remainingPlayers();
      const wheel = mountWheelRoulette(mount, rem, (idx) => {
        const winner = rem[idx];
        S.spinningName = false;
        if (!winner) return;
        S.currentPlayer = winner;
        S.productRetries = MAX_PRODUCT_RETRIES;
        S.stage = "nameReveal";
        sound.win();
        burst(1);
        render();
      });
      activeMounts.push(wheel);
    }
  } else if (S.stage === "product") {
    const mount = document.getElementById("reel-mount");
    if (mount) {
      const reel = mountProductReel(mount, () => {
        S.spinningProduct = false;
        sound.win();
        burst(1);
        S.stage = "productReveal";
        render();
      });
      activeMounts.push(reel);
    }
  } else if (S.stage === "pitch") {
    const mount = document.getElementById("timer-mount");
    if (mount) activeMounts.push(mountPitchTimer(mount, S.pitchDuration));
  }
}

render();
</script>
</body>
</html>
